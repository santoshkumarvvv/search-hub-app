name: 🐍 Red Snake — Contribution Animation

on:
  schedule:
    # Run automatically every 6 hours
    - cron: "0 */6 * * *"
  workflow_dispatch:
    # Allow manual execution from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Generate the Red Snake contribution grid animation
        uses: Platane/snk@v3
        with:
          github_user_name: santoshkumarvvv
          outputs: |
            dist/github-snake.svg?color_snake=#ff0000&color_dots=#0d1117,#330a0a,#661414,#991f1f,#cc2929
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#ff0000&color_dots=#0d1117,#330a0a,#661414,#991f1f,#cc2929
            dist/github-snake.gif?color_snake=#ff0000&color_dots=#0d1117,#330a0a,#661414,#991f1f,#cc2929

      - name: 🚀 Deploy snake artifacts to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
